name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    name: Audit Project
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Typecheck
      run: npm run typecheck
      
    - name: Lint
      run: npm run lint
      
    - name: Test
      run: npm run test

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Build
      run: npm run build
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
